services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://workbench:${POSTGRES_PASSWORD}@db:5432/workbench
      DB_SCHEMA: workbench
      WORKBENCH_PASSWORD: ${WORKBENCH_PASSWORD:-}
      WORKBENCH_SECRET: ${WORKBENCH_SECRET:-change-me}
    ports:
      # Loopback only by default; expose on the tailnet with `tailscale serve`.
      - "${WORKBENCH_BIND:-127.0.0.1}:${WORKBENCH_PORT:-8080}:8000"
    volumes:
      - ./data:/data:ro   # drop migration JSON here for `app.seed import /data/...`

volumes:
  pgdata:
